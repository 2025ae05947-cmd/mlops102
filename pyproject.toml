[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-mlops"
version = "0.1.0"
description = "Heart disease prediction MLOps project"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "scikit-learn>=1.5.2",
  "matplotlib>=3.8.4",
  "seaborn>=0.13.2",
  "mlflow>=2.15.1",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.1",
  "joblib>=1.4.2",
  "pytest>=8.3.2",
  "httpx>=0.27.0",
  "requests>=2.32.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
